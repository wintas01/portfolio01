name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - run: pnpm install --frozen-lockfile
      # Rebuild every CV (10 languages) from src/data/projects.json, so a
      # project added to the site is on the downloadable CVs too. If this ever
      # fails, the site still deploys with the CVs already in the repo.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Time-limited: if anything here stalls, the site still deploys with the
      # CVs already saved in the repo.
      - name: Generate CVs
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 fonts-noto-core fonts-noto-cjk fonts-texgyre fonts-dejavu-core fonts-freefont-ttf
          pip install --quiet --timeout 30 playwright pillow
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" timeout 180 python scripts/cv/generate_cv_translations.py
      - run: pnpm --filter @workspace/portfolio run build
        env:
          BASE_PATH: /portfolio01/
          VITE_CV_VERSION: ${{ github.sha }}
          VITE_GITHUB_CONTRIBUTIONS_API_URL: ${{ vars.PORTFOLIO_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/portfolio/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
