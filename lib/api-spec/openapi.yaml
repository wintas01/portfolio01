openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: github
    description: GitHub contribution activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /github/contributions:
    get:
      operationId: getGithubContributions
      tags: [github]
      summary: Get GitHub contribution activity
      description: Returns anonymized daily contribution counts for the selected year
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2015
      responses:
        "200":
          description: Contribution activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubContributions"
        "400":
          description: Invalid year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: GitHub contribution data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GithubContributionDay:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        count:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 0
          maximum: 4
      required:
        - date
        - count
        - level
    GithubContributions:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/GithubContributionDay"
      required:
        - total
        - contributions
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

