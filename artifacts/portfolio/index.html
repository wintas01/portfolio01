    <!-- Intro video (loading screen). Shown only when JavaScript runs and the
         visitor has not asked their device to reduce motion. -->
    <script>
      try {
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("intro-on");
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      html.intro-on, html.intro-on body { overflow: hidden; }
      html.intro-on #intro {
        position: fixed; inset: 0; z-index: 2147483647; display: flex; overflow: hidden;
        align-items: center; justify-content: center; background: #000;
        transition: opacity 0.7s ease;
      }
      #intro.intro-done { opacity: 0; pointer-events: none; }
      /* Size the 1920x1080 intro (pure black background) to the screen so the
         logo + WINTAS block (about 38.5% of the video's width, 66% of its
         height) fills up to 84% of the screen's width or 78% of its height,
         whichever comes first: big on phones, tablets, laptops and ultrawides,
         never cut off. The extra black around it is simply clipped. */
      #intro video {
        flex: none; max-width: none; max-height: none; height: auto;
        width: min(218vw, 210vh);
        transform: translateY(-3%);
      }
      @supports (height: 100dvh) {
        #intro video { width: min(218vw, 210dvh); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="intro">
      <video id="intro-video" muted playsinline autoplay preload="auto" disablepictureinpicture
        aria-hidden="true" tabindex="-1">
        <source src="%BASE_URL%intro.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      (function () {
        var html = document.documentElement;
        var intro = document.getElementById("intro");
        if (!html.classList.contains("intro-on")) { intro.remove(); return; }
        var video = document.getElementById("intro-video");

        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          intro.classList.add("intro-done");
          html.classList.remove("intro-on");
          setTimeout(function () { try { video.pause(); } catch (e) {} intro.remove(); }, 750);
        }
        video.muted = true; // belt and braces: the file has no sound track either
        video.addEventListener("ended", finish);
        video.addEventListener("error", finish, true);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") finish(); });
        // If the video cannot start (e.g. autoplay blocked in battery saver), do not trap the visitor.
        // Judge by the playhead, not by events: some mobile browsers skip "playing".
        setTimeout(function () {
          var moving = !video.paused && video.currentTime > 0;
          if (!moving) finish();
        }, 2500);
        setTimeout(finish, 9000); // hard limit
        var p = video.play && video.play();
        if (p && p.catch) p.catch(function () { finish(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
