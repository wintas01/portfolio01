    <!-- Intro video (loading screen). Shown only when JavaScript runs and the
         visitor has not asked their device to reduce motion. -->
    <script>
      // Shown once per visit (browser tab session), not again on reloads.
      try {
        var introSeen = false;
        try { introSeen = sessionStorage.getItem("wintas-intro-seen") === "1"; } catch (e) {}
        if (!introSeen && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("intro-on");
          try { sessionStorage.setItem("wintas-intro-seen", "1"); } catch (e) {}
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      html.intro-on, html.intro-on body { overflow: hidden; }
      html.intro-on #intro {
        position: fixed; inset: 0; z-index: 2147483647; display: flex; overflow: hidden;
        align-items: center; justify-content: center; background: #fff;
        transition: opacity 0.7s ease;
      }
      #intro.intro-done { opacity: 0; pointer-events: none; }
      /* Size the 1920x1080 intro to the screen: the final W + INTAS lockup is
         46% of the video's width, so 185vw makes it ~86% of a phone's width;
         178vh lets it fill a laptop or desktop exactly. Whatever the video does
         not cover takes the video's own edge colours (script below), so the
         white -> black -> white changes fill the whole screen on every device. */
      #intro video {
        flex: none; max-width: none; max-height: none; height: auto;
        width: min(185vw, 178vh);
      }
      @supports (height: 100dvh) {
        #intro video { width: min(185vw, 178dvh); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="intro">
      <video id="intro-video" muted playsinline autoplay preload="auto" disablepictureinpicture
        aria-hidden="true" tabindex="-1">
        <source src="%BASE_URL%intro.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      (function () {
        var html = document.documentElement;
        var intro = document.getElementById("intro");
        if (!html.classList.contains("intro-on")) { intro.remove(); return; }
        var video = document.getElementById("intro-video");

        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          intro.classList.add("intro-done");
          html.classList.remove("intro-on");
          setTimeout(function () { try { video.pause(); } catch (e) {} intro.remove(); }, 750);
        }
        video.muted = true; // belt and braces: the file has no sound track either

        // Paint the area around the video with the colours at the video's top
        // and bottom edges, every frame, so it always looks full-screen.
        var probe = document.createElement("canvas");
        probe.width = 1; probe.height = 2;
        var pctx = probe.getContext("2d", { willReadFrequently: true });
        (function syncEdges() {
          if (finished) return;
          if (video.readyState >= 2 && video.videoWidth) {
            try {
              var vw = video.videoWidth, vh = video.videoHeight;
              pctx.drawImage(video, vw / 2 - 2, 1, 4, 4, 0, 0, 1, 1);
              pctx.drawImage(video, vw / 2 - 2, vh - 5, 4, 4, 0, 1, 1, 1);
              var px = pctx.getImageData(0, 0, 1, 2).data;
              intro.style.background = "linear-gradient(to bottom, rgb(" + px[0] + "," + px[1] + "," + px[2] +
                ") 50%, rgb(" + px[4] + "," + px[5] + "," + px[6] + ") 50%)";
            } catch (e) {}
          }
          requestAnimationFrame(syncEdges);
        })();
        video.addEventListener("ended", finish);
        video.addEventListener("error", finish, true);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") finish(); });
        // If the video cannot start (e.g. autoplay blocked in battery saver), do not trap the visitor.
        // Judge by the playhead, not by events: some mobile browsers skip "playing".
        setTimeout(function () {
          var moving = !video.paused && video.currentTime > 0;
          if (!moving) finish();
        }, 2500);
        setTimeout(finish, 9000); // hard limit
        var p = video.play && video.play();
        if (p && p.catch) p.catch(function () { finish(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
