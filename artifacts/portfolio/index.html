    <!-- Intro video (loading screen). Shown only when JavaScript runs and the
         visitor has not asked their device to reduce motion. -->
    <script>
      try {
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("intro-on");
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      html.intro-on, html.intro-on body { overflow: hidden; }
      html.intro-on #intro {
        position: fixed; inset: 0; z-index: 2147483647; display: flex;
        align-items: center; justify-content: center; background: #000;
        transition: opacity 0.7s ease;
      }
      #intro.intro-done { opacity: 0; pointer-events: none; }
      /* The intro is 1280x720 on pure black, so it can fill the screen with no seams. */
      #intro video { width: min(100vw, 1280px); height: auto; max-height: 100vh; object-fit: cover; }
      @media (orientation: portrait) {
        #intro video { width: 200vw; max-width: none; max-height: none; }
      }
      #intro-skip {
        position: absolute; right: 20px; bottom: 20px; min-height: 44px; padding: 0 18px;
        border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08); color: #fff; cursor: pointer;
        font: 600 14px/1 Inter, system-ui, sans-serif; letter-spacing: 0.02em;
      }
      #intro-skip:hover { background: rgba(255, 255, 255, 0.18); }
      #intro-skip:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="intro">
      <video id="intro-video" muted playsinline autoplay preload="auto" disablepictureinpicture
        aria-hidden="true" tabindex="-1">
        <source src="%BASE_URL%intro.mp4" type="video/mp4" />
      </video>
      <button id="intro-skip" type="button">Skip</button>
    </div>
    <script>
      (function () {
        var html = document.documentElement;
        var intro = document.getElementById("intro");
        if (!html.classList.contains("intro-on")) { intro.remove(); return; }
        var video = document.getElementById("intro-video");
        var skip = document.getElementById("intro-skip");
        // Skip label in the visitor's language (same choice the site makes).
        var labels = { en: "Skip", fr: "Passer", es: "Saltar", pt: "Pular", de: "Überspringen",
          ar: "تخطي", zh: "跳过", ja: "スキップ", ko: "건너뛰기", hi: "छोड़ें" };
        var lang = "en";
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var saved = localStorage.getItem("wintas-language");
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          lang = [q, saved, nav.toLowerCase().split("-")[0]].filter(function (l) { return labels[l]; })[0] || "en";
        } catch (e) {}
        skip.textContent = labels[lang];
        skip.setAttribute("aria-label", labels[lang]);

        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          intro.classList.add("intro-done");
          html.classList.remove("intro-on");
          setTimeout(function () { try { video.pause(); } catch (e) {} intro.remove(); }, 750);
        }
        video.muted = true; // belt and braces: the file has no sound track either
        video.addEventListener("ended", finish);
        video.addEventListener("error", finish, true);
        skip.addEventListener("click", finish);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") finish(); });
        // If the video cannot start (e.g. autoplay blocked in battery saver), do not trap the visitor.
        // Judge by the playhead, not by events: some mobile browsers skip "playing".
        setTimeout(function () {
          var moving = !video.paused && video.currentTime > 0;
          if (!moving) finish();
        }, 2500);
        setTimeout(finish, 9000); // hard limit
        var p = video.play && video.play();
        if (p && p.catch) p.catch(function () { finish(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
